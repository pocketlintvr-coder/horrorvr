<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Horror Experience</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      background: #8b0000;
      color: #fff;
      border: 2px solid #ff0000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      border-radius: 6px;
    }
    #vr-button:hover { background: #ff0000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="vr-button">ENTER VR</button>

  <script>
    let scene, camera, renderer, flashlight, ambientLight;
    let monster, cameraGroup;
    
    let controller1, controller2;
    let grip1, grip2;
    
    const prevHandPos1 = new THREE.Vector3();
    const prevHandPos2 = new THREE.Vector3();
    const currHandPos1 = new THREE.Vector3();
    const currHandPos2 = new THREE.Vector3();

    let playerVelocityY = 0;
    const gravity = -0.005;

    // Movement Safety Caps
    const MAX_SWING_SPEED = 0.35; // Prevents being flung into the abyss
    const MAX_JUMP_FORCE = 0.15;

    init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111118);
      scene.fog = new THREE.FogExp2(0x111118, 0.05);

      cameraGroup = new THREE.Group();
      scene.add(cameraGroup);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      cameraGroup.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      ambientLight = new THREE.AmbientLight(0x404050, 1.5);
      scene.add(ambientLight);

      const ceilingLight = new THREE.PointLight(0xffffff, 1.5, 30);
      ceilingLight.position.set(0, 4, -10);
      scene.add(ceilingLight);

      flashlight = new THREE.SpotLight(0xffffff, 4, 35, Math.PI / 4, 0.5, 1);
      const lightTarget = new THREE.Object3D();
      lightTarget.position.set(0, 0, -5);
      camera.add(lightTarget);
      flashlight.target = lightTarget;
      camera.add(flashlight);

      createEnvironment();
      createMonster();
      setupControllers();

      document.getElementById('vr-button').addEventListener('click', onEnterVR);
      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function setupControllers() {
      controller1 = renderer.xr.getController(0);
      controller2 = renderer.xr.getController(1);
      cameraGroup.add(controller1);
      cameraGroup.add(controller2);

      grip1 = renderer.xr.getControllerGrip(0);
      grip2 = renderer.xr.getControllerGrip(1);

      const handGeo = new THREE.SphereGeometry(0.18, 16, 16);
      const handMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2, emissive: 0x330000 });

      grip1.add(new THREE.Mesh(handGeo, handMat));
      grip2.add(new THREE.Mesh(handGeo, handMat));

      cameraGroup.add(grip1);
      cameraGroup.add(grip2);
    }

    function processMovement() {
      const session = renderer.xr.getSession();
      if (!session) return;

      scene.updateMatrixWorld(true);

      // Thumbstick backup movement
      for (const source of session.inputSources) {
        if (source.gamepad && source.gamepad.axes) {
          const axes = source.gamepad.axes;
          const axisX = axes[2] || axes[0] || 0;
          const axisY = axes[3] || axes[1] || 0;

          if (Math.abs(axisX) > 0.1 || Math.abs(axisY) > 0.1) {
            const moveSpeed = 0.08;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const sideDir = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

            cameraGroup.position.addScaledVector(dir, -axisY * moveSpeed);
            cameraGroup.position.addScaledVector(sideDir, -axisX * moveSpeed);
          }
        }
      }

      // Gorilla Tag Arm Movement
      const hands = [
        { grip: grip1, curr: currHandPos1, prev: prevHandPos1 },
        { grip: grip2, curr: currHandPos2, prev: prevHandPos2 }
      ];

      let touchingGround = false;

      hands.forEach((h) => {
        if (!h.grip) return;

        h.grip.getWorldPosition(h.curr);

        // Compute Delta
        const delta = new THREE.Vector3().subVectors(h.prev, h.curr);

        // Clamp speed spikes to prevent flinging
        delta.x = Math.max(-MAX_SWING_SPEED, Math.min(MAX_SWING_SPEED, delta.x));
        delta.z = Math.max(-MAX_SWING_SPEED, Math.min(MAX_SWING_SPEED, delta.z));
        delta.y = Math.max(-MAX_SWING_SPEED, Math.min(MAX_SWING_SPEED, delta.y));

        const groundHeight = cameraGroup.position.y + 0.8;

        if (h.curr.y <= groundHeight) {
          touchingGround = true;

          // Push player back away from hand direction
          cameraGroup.position.x += delta.x * 1.5;
          cameraGroup.position.z += delta.z * 1.5;

          if (delta.y > 0) {
            playerVelocityY = Math.min(delta.y * 1.2, MAX_JUMP_FORCE);
          }
        }

        h.prev.copy(h.curr);
      });

      // Gravity Processing
      if (!touchingGround && cameraGroup.position.y > 0) {
        playerVelocityY += gravity;
        cameraGroup.position.y += playerVelocityY;

        if (cameraGroup.position.y < 0) {
          cameraGroup.position.y = 0;
          playerVelocityY = 0;
        }
      } else if (touchingGround) {
        if (playerVelocityY < 0) playerVelocityY = 0;
      }

      // MAP BOUNDARY SAFETY CHECKS
      cameraGroup.position.x = Math.max(-13, Math.min(13, cameraGroup.position.x)); // Side wall bounds
      cameraGroup.position.z = Math.max(-45, Math.min(10, cameraGroup.position.z)); // Hallway end bounds
    }

    function createEnvironment() {
      const floorGeo = new THREE.PlaneGeometry(30, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = floor.clone();
      ceiling.position.y = 5;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 });
      
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      leftWall.position.set(-15, 2.5, 0);
      leftWall.rotation.y = Math.PI / 2;
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      rightWall.position.set(15, 2.5, 0);
      rightWall.rotation.y = -Math.PI / 2;
      scene.add(rightWall);
    }

    function createMonster() {
      const monsterGroup = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.5, 0.2, 3, 8);
      const monsterMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, monsterMat);
      body.position.y = 1.5;
      monsterGroup.add(body);

      const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.18, 2.5, 0.3);
      
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.18, 2.5, 0.3);

      monsterGroup.add(leftEye);
      monsterGroup.add(rightEye);

      monsterGroup.position.set(0, 0, -25);
      scene.add(monsterGroup);
      monster = monsterGroup;
    }

    function onEnterVR() {
      if (!('xr' in navigator)) {
        alert("WebXR API not available. Make sure you are using an HTTPS URL inside your VR headset browser.");
        return;
      }

      navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      }).then((session) => {
        renderer.xr.setSession(session);
        document.getElementById('vr-button').style.display = 'none';

        session.addEventListener('end', () => {
          document.getElementById('vr-button').style.display = 'block';
        });
      }).catch((err) => {
        console.error("VR Session Failed:", err);
        alert("Could not start VR session. Ensure the URL starts with https://");
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp) {
      processMovement();

      if (flashlight) {
        flashlight.intensity = 3.5 + Math.sin(timestamp * 0.02) * 0.3;
      }

      if (monster && monster.position.z < cameraGroup.position.z) {
        monster.position.z += 0.01;
        monster.position.x = Math.sin(timestamp * 0.003) * 0.8;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
