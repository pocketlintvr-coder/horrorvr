<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Horror Experience</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: #8b0000;
      color: #fff;
      border: 1px solid #ff0000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      border-radius: 4px;
    }
    #vr-button:hover { background: #ff0000; }
    #vr-button:disabled { background: #333; border-color: #555; color: #888; cursor: not-allowed; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="vr-button">CHECKING VR SUPPORT...</button>

  <script>
    let scene, camera, renderer, flashlight;
    let monster, cameraGroup;
    
    // VR Controllers & Physics
    let controller1, controller2;
    const prevPos1 = new THREE.Vector3();
    const prevPos2 = new THREE.Vector3();
    const currentPos1 = new THREE.Vector3();
    const currentPos2 = new THREE.Vector3();
    
    let playerVelocityY = 0;
    const gravity = -0.005;
    const floorY = 0;

    init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020202);
      scene.fog = new THREE.FogExp2(0x020202, 0.15);

      cameraGroup = new THREE.Group();
      scene.add(cameraGroup);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      cameraGroup.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lighting & Flashlight
      const ambientLight = new THREE.AmbientLight(0x050508, 0.2);
      scene.add(ambientLight);

      flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI / 6, 0.5, 1);
      const lightTarget = new THREE.Object3D();
      lightTarget.position.set(0, 0, -5);
      camera.add(lightTarget);
      flashlight.target = lightTarget;
      camera.add(flashlight);

      createEnvironment();
      createMonster();
      setupControllers();

      setupVR();
      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function setupControllers() {
      controller1 = renderer.xr.getController(0);
      controller2 = renderer.xr.getController(1);

      cameraGroup.add(controller1);
      cameraGroup.add(controller2);

      // Visible Hand Spheres
      const handGeo = new THREE.SphereGeometry(0.12, 16, 16);
      const handMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.3 });

      controller1.add(new THREE.Mesh(handGeo, handMat));
      controller2.add(new THREE.Mesh(handGeo, handMat));
    }

    function handleGorillaPhysics() {
      const controllers = [
        { obj: controller1, prev: prevPos1, curr: currentPos1 },
        { obj: controller2, prev: prevPos2, curr: currentPos2 }
      ];

      let isTouchingGround = false;

      controllers.forEach((c) => {
        if (!c.obj) return;

        c.obj.getWorldPosition(c.curr);

        // Calculate arm movement delta
        const delta = new THREE.Vector3().subVectors(c.prev, c.curr);

        // Check if controller hand touches or goes below ground floor (Y = 0)
        if (c.curr.y <= 0.15) {
          isTouchingGround = true;

          // Push player in opposite direction of hand drag (Gorilla Tag physics)
          cameraGroup.position.x += delta.x * 2.0;
          cameraGroup.position.z += delta.z * 2.0;

          // Push upward if slapping down on ground
          if (delta.y > 0) {
            playerVelocityY = delta.y * 1.5;
          }
        }

        c.prev.copy(c.curr);
      });

      // Apply Gravity when airborne
      if (!isTouchingGround && cameraGroup.position.y > floorY) {
        playerVelocityY += gravity;
        cameraGroup.position.y += playerVelocityY;

        // Snap back to floor baseline
        if (cameraGroup.position.y < floorY) {
          cameraGroup.position.y = floorY;
          playerVelocityY = 0;
        }
      } else if (isTouchingGround) {
        // Stop falling when touching floor
        if (playerVelocityY < 0) playerVelocityY = 0;
      }
    }

    function createEnvironment() {
      const floorGeo = new THREE.PlaneGeometry(30, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = floor.clone();
      ceiling.position.y = 5;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
      
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      leftWall.position.set(-15, 2.5, 0);
      leftWall.rotation.y = Math.PI / 2;
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      rightWall.position.set(15, 2.5, 0);
      rightWall.rotation.y = -Math.PI / 2;
      scene.add(rightWall);
    }

    function createMonster() {
      const monsterGroup = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.4, 0.2, 3, 8);
      const monsterMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const body = new THREE.Mesh(bodyGeo, monsterMat);
      body.position.y = 1.5;
      monsterGroup.add(body);

      const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.15, 2.5, 0.3);
      
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.15, 2.5, 0.3);

      monsterGroup.add(leftEye);
      monsterGroup.add(rightEye);

      monsterGroup.position.set(0, 0, -25);
      scene.add(monsterGroup);
      monster = monsterGroup;
    }

    function setupVR() {
      const button = document.getElementById('vr-button');

      if (!window.isSecureContext) {
        button.textContent = 'NEEDS HTTPS OR LOCALHOST';
        button.disabled = true;
        return;
      }

      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            button.textContent = 'ENTER VR';
            button.addEventListener('click', onEnterVR);
          } else {
            button.textContent = 'VR NOT SUPPORTED';
            button.disabled = true;
          }
        });
      }
    }

    function onEnterVR() {
      navigator.xr.requestSession('immersive-vr', {
        requiredFeatures: ['local-floor'],
        optionalFeatures: ['bounded-floor']
      }).then((session) => {
        renderer.xr.setSession(session);
        renderer.xr.setReferenceSpaceType('local-floor');
        document.getElementById('vr-button').style.display = 'none';
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(time) {
      handleGorillaPhysics();

      if (flashlight) {
        flashlight.intensity = 1.8 + Math.sin(time * 0.02) * 0.3 + (Math.random() < 0.05 ? -0.8 : 0);
      }

      if (monster && monster.position.z < cameraGroup.position.z) {
        monster.position.z += 0.01;
        monster.position.x = Math.sin(time * 0.003) * 0.8;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
