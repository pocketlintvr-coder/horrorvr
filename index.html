<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Horror Experience</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: #8b0000;
      color: #fff;
      border: 1px solid #ff0000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
      border-radius: 4px;
    }
    #vr-button:hover { background: #ff0000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <button id="vr-button">ENTER VR</button>

  <script>
    let scene, camera, renderer, flashlight;
    let monster, cameraGroup;
    
    // Hand Tracking Data
    const handPrevPos = [new THREE.Vector3(), new THREE.Vector3()];
    const handCurrPos = [new THREE.Vector3(), new THREE.Vector3()];
    const handMesh = [];

    let playerVelocityY = 0;
    const gravity = -0.006;
    const handRadius = 0.15;

    init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020202);
      scene.fog = new THREE.FogExp2(0x020202, 0.15);

      cameraGroup = new THREE.Group();
      scene.add(cameraGroup);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      cameraGroup.add(camera);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x050508, 0.3);
      scene.add(ambientLight);

      flashlight = new THREE.SpotLight(0xffffff, 2, 15, Math.PI / 6, 0.5, 1);
      const lightTarget = new THREE.Object3D();
      lightTarget.position.set(0, 0, -5);
      camera.add(lightTarget);
      flashlight.target = lightTarget;
      camera.add(flashlight);

      createEnvironment();
      createMonster();
      setupHandVisuals();

      // Bind direct click to Enter VR
      document.getElementById('vr-button').addEventListener('click', onEnterVR);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(render);
    }

    function setupHandVisuals() {
      const handGeo = new THREE.SphereGeometry(handRadius, 16, 16);
      const handMat = new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 0.3 });

      for (let i = 0; i < 2; i++) {
        const mesh = new THREE.Mesh(handGeo, handMat);
        scene.add(mesh);
        handMesh.push(mesh);
      }
    }

    function updateGorillaLocomotion(timestamp, frame) {
      if (!frame) return;

      const session = renderer.xr.getSession();
      const refSpace = renderer.xr.getReferenceSpace();

      if (!session || !refSpace) return;

      let isAnyHandTouchingGround = false;
      let handIndex = 0;

      for (const inputSource of session.inputSources) {
        if (inputSource.gripSpace && handIndex < 2) {
          const pose = frame.getPose(inputSource.gripSpace, refSpace);

          if (pose) {
            const p = pose.transform.position;
            handCurrPos[handIndex].set(p.x, p.y, p.z);

            handMesh[handIndex].position.copy(handCurrPos[handIndex]);

            const delta = new THREE.Vector3().subVectors(handPrevPos[handIndex], handCurrPos[handIndex]);
            const groundY = cameraGroup.position.y + handRadius;

            if (handCurrPos[handIndex].y <= groundY) {
              isAnyHandTouchingGround = true;

              cameraGroup.position.x += delta.x * 2.5;
              cameraGroup.position.z += delta.z * 2.5;

              if (delta.y > 0) {
                playerVelocityY = delta.y * 1.8;
              }
            }

            handPrevPos[handIndex].copy(handCurrPos[handIndex]);
          }
          handIndex++;
        }
      }

      if (!isAnyHandTouchingGround && cameraGroup.position.y > 0) {
        playerVelocityY += gravity;
        cameraGroup.position.y += playerVelocityY;

        if (cameraGroup.position.y < 0) {
          cameraGroup.position.y = 0;
          playerVelocityY = 0;
        }
      } else if (isAnyHandTouchingGround) {
        if (playerVelocityY < 0) playerVelocityY = 0;
      }
    }

    function createEnvironment() {
      const floorGeo = new THREE.PlaneGeometry(30, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = floor.clone();
      ceiling.position.y = 5;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
      
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      leftWall.position.set(-15, 2.5, 0);
      leftWall.rotation.y = Math.PI / 2;
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 5), wallMat);
      rightWall.position.set(15, 2.5, 0);
      rightWall.rotation.y = -Math.PI / 2;
      scene.add(rightWall);
    }

    function createMonster() {
      const monsterGroup = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.4, 0.2, 3, 8);
      const monsterMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const body = new THREE.Mesh(bodyGeo, monsterMat);
      body.position.y = 1.5;
      monsterGroup.add(body);

      const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.15, 2.5, 0.3);
      
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.15, 2.5, 0.3);

      monsterGroup.add(leftEye);
      monsterGroup.add(rightEye);

      monsterGroup.position.set(0, 0, -25);
      scene.add(monsterGroup);
      monster = monsterGroup;
    }

    function onEnterVR() {
      if (!('xr' in navigator)) {
        alert("WebXR API not detected. Make sure you are using an HTTPS URL inside your VR headset browser.");
        return;
      }

      navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      }).then((session) => {
        renderer.xr.setSession(session);
        document.getElementById('vr-button').style.display = 'none';

        session.addEventListener('end', () => {
          document.getElementById('vr-button').style.display = 'block';
        });
      }).catch((err) => {
        console.error("VR Session Failed:", err);
        alert("Could not open VR session. Ensure the URL starts with https://");
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function render(timestamp, frame) {
      updateGorillaLocomotion(timestamp, frame);

      if (flashlight) {
        flashlight.intensity = 1.8 + Math.sin(timestamp * 0.02) * 0.3 + (Math.random() < 0.05 ? -0.8 : 0);
      }

      if (monster && monster.position.z < cameraGroup.position.z) {
        monster.position.z += 0.01;
        monster.position.x = Math.sin(timestamp * 0.003) * 0.8;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
